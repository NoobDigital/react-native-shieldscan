buildscript {
  repositories {
    google()
    mavenCentral()
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

android {
  compileSdkVersion 34
  namespace "com.shieldscan"

  defaultConfig {
    minSdkVersion 23
    targetSdkVersion 34
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // React Native — provided by the consuming app, not bundled
  implementation "com.facebook.react:react-android"

  // RootBeer: comprehensive root detection
  // Using compileOnly is intentional if the host app already includes it;
  // switch to 'implementation' if you want it bundled unconditionally.
  implementation 'com.scottyab:rootbeer-lib:0.1.1'
}
